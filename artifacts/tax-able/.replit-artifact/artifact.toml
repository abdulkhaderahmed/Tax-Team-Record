kind = "web"
previewPath = "/"
title = "Tax-Able"
version = "1.0.0"
id = "artifacts/tax-able"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25975

[services.development]
run = "pnpm --filter @workspace/tax-able run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tax-able", "run", "build" ]
publicDir = "artifacts/tax-able/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25975"
BASE_PATH = "/"
